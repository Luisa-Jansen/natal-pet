name = "natal-pet"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Banco de dados D1 (guarda as adoções das cartinhas).
# Para produção: rode `npx wrangler d1 create natal_pet_db` e cole o database_id abaixo.
# Em desenvolvimento local o database_id pode ficar como está (usa um SQLite local).
[[d1_databases]]
binding = "DB"
database_name = "natal_pet_db"
database_id = "0ba4d73c-b117-4a4f-b62c-d9d4ec479f8a"

# Armazenamento de arquivos (fotos dos animais e comprovantes de PIX).
# Usa Cloudflare KV (gratuito, sem precisar ativar o R2). Crie uma vez:
# `npx wrangler kv namespace create UPLOADS` e cole o id retornado abaixo.
[[kv_namespaces]]
binding = "UPLOADS"
id = "133a57d3db0247a293f7ef5b568c9f94"
